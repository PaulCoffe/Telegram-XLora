name: Build Release APK

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo docker image prune --all --force
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIR/dotnet"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf meson ninja-build yasm unzip python3 python3-pip python3-setuptools

      - name: Setup NDK r21e
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk-r21e
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Setup NDK r23c
        uses: nttld/setup-ndk@v1.5.0
        id: setup-ndk-r23c
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Setup Build Environment (Dummies)
        run: |
          mkdir -p TMessagesProj/config
          echo "Generating dummy release.keystore..."
          # Fix for keytool interactivity: use -storepass and -keypass consistently
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias alias -keyalg RSA -keysize 2048 -validity 10000 -dname "cn=Test, ou=Test, o=Test, l=Test, s=Test, c=US" -storepass password -keypass password
          
          if [ ! -f TMessagesProj/google-services.json ]; then
            echo "{}" > TMessagesProj/google-services.json
          fi

      - name: Prepare gradle.properties
        run: |
          echo "Injecting API keys..."
          vars=gradle.properties
          echo "APP_ID=${{ secrets.API_ID }}" >> $vars
          echo "APP_HASH=${{ secrets.API_HASH }}" >> $vars
          # Add passwords for dummy keystore to satisfy Gradle
          echo "RELEASE_KEY_PASSWORD=password" >> $vars
          echo "RELEASE_KEY_ALIAS=alias" >> $vars
          echo "RELEASE_STORE_PASSWORD=password" >> $vars
          # Forkgram specific flags
          echo "org.gradle.workers.max=1" >> $vars

      - name: Build APK (:TMessagesProj_App:assembleAfatRelease)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Release-APK
          path: |
            TMessagesProj_App/build/outputs/apk/afat/release/*.apk
            TMessagesProj/build/outputs/apk/afat/release/*.apk
            TMessagesProj/build/outputs/apk/*/release/*.apk
