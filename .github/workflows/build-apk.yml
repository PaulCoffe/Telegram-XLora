name: Build Release APK

on:
  push:
    branches: [ "dev", "mesh-dev" ]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Native Build Tools
        run: |
          sudo apt update
          sudo apt -y install ninja-build meson unzip python3-pip python3-setuptools gperf yasm nasm
          pip3 install requests tgcrypto-pyrofork Kurigram

      - name: Set up NDK r21e
        id: setup-ndk-r21e
        uses: nttld/setup-ndk@v1.4.2
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Set up NDK r23c
        uses: nttld/setup-ndk@v1.4.2
        with:
          ndk-version: r23c
          link-to-sdk: true

      - name: Cache Native Libraries
        id: cache-native
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/jni/ffmpeg/ffmpeg/build
            TMessagesProj/jni/libvpx/libvpx/build
            TMessagesProj/jni/boringssl/boringssl/build
          key: native-libs-arm64-${{ runner.os }}-${{ hashFiles('TMessagesProj/jni/*.sh') }}
          restore-keys: |
            native-libs-arm64-${{ runner.os }}-

      - name: Build Native Dependencies
        run: |
          set -ex
          # Use NDK provided by setup-ndk action
          export ANDROID_NDK_HOME="${{ steps.setup-ndk-r21e.outputs.ndk-path }}"
          export NDK="$ANDROID_NDK_HOME"
          
          # Ensure ANDROID_HOME is set (default for GitHub Runners)
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK="$ANDROID_HOME"
          
          # Find sdkmanager
          if command -v sdkmanager > /dev/null; then
            SDK_MANAGER="sdkmanager"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDK_MANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          else
            echo "Error: sdkmanager not found"
            exit 1
          fi
          
          "$SDK_MANAGER" "cmake;3.22.1"
          
          # Fix for BoringSSL build: export Ninja path
          export NINJA_PATH=$(which ninja)
          export ANDROID_SDK="$ANDROID_HOME"
          
          cd TMessagesProj/jni
          if [ "${{ steps.cache-native.outputs.cache-hit }}" != 'true' ]; then
            ./build_libvpx_clang.sh arm64
            ./build_ffmpeg_clang.sh arm64
            ./patch_ffmpeg.sh
            ./patch_boringssl.sh
            ./build_boringssl.sh arm64
          else
            echo "Native libraries restored from cache."
          fi

      - name: Prepare Build Environment
        run: |
          # Configure gradle.properties (Root level)
          vars=gradle.properties
          echo "DUMMY_CONST=0" >> $vars
          echo "org.gradle.workers.max=1" >> $vars
          echo "APP_ID=${{ secrets.API_ID || '12345' }}" >> $vars
          echo "APP_HASH=${{ secrets.API_HASH || 'abcdef0123456789' }}" >> $vars
          echo "RELEASE_KEY_PASSWORD=password" >> $vars
          echo "RELEASE_KEY_ALIAS=tg-x-lora" >> $vars
          echo "RELEASE_STORE_PASSWORD=password" >> $vars
          echo "ADDITIONAL_BUILD_NUMBER=0" >> $vars
          echo "USER_REPO=$GITHUB_REPOSITORY" >> $vars
          echo "CHECK_UPDATES=1" >> $vars
          echo "VERSION_NUM=7" >> $vars
          
          # Forkgram specific properties (to avoid PropertyNotFoundException)
          echo "USER_ID_OWNER=0" >> $vars
          echo "UPDATE_CHANNEL_USERNAME=null" >> $vars
          echo "LASTFM_API_KEY=null" >> $vars
          echo "LASTFM_API_SECRET=null" >> $vars
          echo "IS_PRIVATE=false" >> $vars
          
          # Append to submodules instead of overwriting to preserve module-specific properties
          cat gradle.properties >> TMessagesProj/gradle.properties
          cat gradle.properties >> TMessagesProj_App/gradle.properties

          # Enable parallel builds in gradle.properties
          echo "org.gradle.parallel=true" >> TMessagesProj/gradle.properties
          echo "org.gradle.parallel=true" >> TMessagesProj_App/gradle.properties

          # Clean up any existing keystore to avoid keytool password conflict
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/release.keystore
          
          # Generate dummy keystore
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore -alias tg-x-lora -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Telegram, O=XLora, C=US"

      - name: Build APK
        run: ./gradlew :TMessagesProj_App:assembleAfatFd_v8aRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-XLora-Release
          path: TMessagesProj_App/build/outputs/apk/afatFd_v8a/release/*.apk
